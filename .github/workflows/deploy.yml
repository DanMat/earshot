name: deploy

# Builds and deploys the site to Cloudflare on every push to main — including the
# daily data refresh commits from pull.yml, so the live site always reflects the
# latest listening. Needs a CLOUDFLARE_API_TOKEN secret (an "Edit Cloudflare
# Workers" token); without it the deploy is skipped, not failed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build + deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping deploy. Add it in repo Settings › Secrets to enable auto-deploy."
            exit 0
          fi
          pnpm build
          pnpm exec wrangler deploy
