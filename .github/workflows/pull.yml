name: pull

# Automatic Audible refresh. Uses the mkb79/setup-audible-cli action to install
# audible-cli and build an ephemeral auth on the runner from the
# AUDIBLE_ADP_TOKEN + AUDIBLE_DEVICE_PRIVATE_KEY secrets (the only two
# credentials ADP request signing needs), pulls + processes the library, and
# commits the curated data when it changes. On failure (usually an expired token)
# it opens a GitHub issue, which emails you, with the fix, and auto-closes it once
# a pull succeeds.

on:
  schedule:
    - cron: '0 8 * * *' # daily, 08:00 UTC
  workflow_dispatch: # let me trigger it by hand too

permissions:
  contents: write # commit refreshed data
  issues: write # open/close the re-auth issue

concurrency:
  group: pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: mkb79/setup-audible-cli@v1
        with:
          adp-token: ${{ secrets.AUDIBLE_ADP_TOKEN }}
          device-private-key: ${{ secrets.AUDIBLE_DEVICE_PRIVATE_KEY }}
          country-code: ${{ vars.AUDIBLE_COUNTRY_CODE }}

      - name: Pull + process + enrich
        run: |
          node scripts/pull.mjs
          node scripts/process.mjs
          node scripts/enrich.mjs
          node scripts/geo.mjs
          node scripts/badges.mjs
          node scripts/wishlist.mjs
          node scripts/listening.mjs

      - name: Commit refreshed data
        run: |
          if [ -n "$(git status --porcelain public/data)" ]; then
            git config user.name "earshot-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "chore: refresh audiobook data"
            git push
            echo "Data updated."
          else
            echo "No changes."
          fi

      - name: Auth recovered — close re-auth issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label audible-auth --state open --json number -q '.[].number'); do
            gh issue close "$n" -c "✅ A scheduled pull just succeeded, auth is healthy again."
          done

      - name: Auth failed — open re-auth issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create audible-auth --color B60205 --description "Audible token needs a refresh" 2>/dev/null || true
          existing=$(gh issue list --label audible-auth --state open --json number -q '.[].number' | head -1)
          body=$(cat <<EOF
          The scheduled Audible pull failed, most likely the device token expired
          (password change, deregistered device, or a security event).

          **Fix:** re-authenticate locally with \`audible quickstart\`, then update
          the \`AUDIBLE_ADP_TOKEN\` and \`AUDIBLE_DEVICE_PRIVATE_KEY\` repo secrets
          from the new auth file (its \`adp_token\` and \`device_private_key\`
          values). The next run (or a manual **Run workflow**) picks it up and
          auto-closes this issue.

          Failed run: $RUN_URL
          EOF
          )
          if [ -z "$existing" ]; then
            gh issue create --label audible-auth --title "🔑 Audible re-auth needed" --body "$body"
          else
            gh issue comment "$existing" --body "Still failing. $RUN_URL"
          fi
